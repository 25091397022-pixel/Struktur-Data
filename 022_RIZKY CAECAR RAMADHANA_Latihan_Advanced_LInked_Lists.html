<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Advanced Linked Lists – Note-Taking App</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Syne:wght@400;600;700;800&display=swap');

  :root {
    --bg:        #0a0d14;
    --surface:   #111520;
    --card:      #161c2d;
    --border:    #1e2840;
    --accent:    #3b82f6;
    --accent2:   #06b6d4;
    --accent3:   #8b5cf6;
    --green:     #10b981;
    --red:       #ef4444;
    --yellow:    #f59e0b;
    --text:      #e2e8f0;
    --muted:     #64748b;
    --mono:      'JetBrains Mono', monospace;
    --sans:      'Syne', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── HEADER ── */
  header {
    border-bottom: 1px solid var(--border);
    padding: 16px 28px;
    display: flex;
    align-items: center;
    gap: 16px;
    background: var(--surface);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  header h1 {
    font-size: 1.1rem;
    font-weight: 800;
    letter-spacing: -0.02em;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .badge {
    font-family: var(--mono);
    font-size: 0.65rem;
    padding: 3px 8px;
    border-radius: 4px;
    background: var(--border);
    color: var(--muted);
    letter-spacing: 0.05em;
  }

  /* ── LAYOUT ── */
  .layout {
    display: grid;
    grid-template-columns: 300px 1fr;
    gap: 0;
    height: calc(100vh - 57px);
  }

  /* ── SIDEBAR ── */
  .sidebar {
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    background: var(--surface);
    overflow: hidden;
  }
  .sidebar-header {
    padding: 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .sidebar-header h2 { font-size: 0.75rem; color: var(--muted); font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; }
  .add-form { display: flex; flex-direction: column; gap: 8px; }
  .add-form input, .add-form textarea {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 10px;
    color: var(--text);
    font-family: var(--sans);
    font-size: 0.82rem;
    outline: none;
    transition: border-color .2s;
    resize: none;
  }
  .add-form input:focus, .add-form textarea:focus { border-color: var(--accent); }
  .add-form textarea { height: 56px; }
  .tag-input-wrap { display: flex; gap: 6px; align-items: center; }
  .tag-input-wrap input { flex: 1; }
  .btn {
    border: none; cursor: pointer; border-radius: 6px; font-family: var(--sans);
    font-weight: 700; font-size: 0.78rem; padding: 8px 14px;
    transition: all .15s; letter-spacing: 0.02em;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: #2563eb; transform: translateY(-1px); }
  .btn-sm { padding: 5px 10px; font-size: 0.72rem; }
  .btn-ghost { background: var(--border); color: var(--muted); }
  .btn-ghost:hover { background: var(--accent3); color: #fff; }
  .btn-danger { background: var(--red); color: #fff; }
  .btn-danger:hover { opacity: .85; }

  /* View selector */
  .view-toggle {
    display: flex;
    padding: 12px 16px 8px;
    gap: 6px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .vtab {
    flex: 1; text-align: center; padding: 6px 0;
    border-radius: 5px; cursor: pointer; font-size: 0.72rem;
    font-weight: 600; color: var(--muted); background: transparent;
    border: none; font-family: var(--sans);
    transition: all .15s; letter-spacing: 0.04em;
  }
  .vtab.active { background: var(--accent); color: #fff; }

  /* Note list */
  .note-list { overflow-y: auto; flex: 1; padding: 8px; }
  .note-item {
    padding: 10px 12px; border-radius: 7px; margin-bottom: 5px;
    cursor: pointer; border: 1px solid transparent;
    transition: all .15s;
  }
  .note-item:hover { background: var(--card); border-color: var(--border); }
  .note-item.selected { background: var(--card); border-color: var(--accent); }
  .note-item .ni-title { font-size: 0.82rem; font-weight: 600; margin-bottom: 4px; }
  .note-item .ni-meta { font-size: 0.68rem; color: var(--muted); font-family: var(--mono); }
  .note-item .ni-tags { margin-top: 5px; display: flex; gap: 4px; flex-wrap: wrap; }
  .tag-chip {
    font-size: 0.63rem; padding: 2px 6px; border-radius: 3px;
    font-family: var(--mono); font-weight: 600; cursor: pointer;
  }
  .tag-chip:hover { opacity: .8; }
  .note-idx {
    float: right; font-family: var(--mono); font-size: 0.65rem;
    color: var(--accent2); opacity: .6; font-weight: 700;
  }

  /* ── MAIN PANEL ── */
  .main {
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .tabs {
    display: flex;
    border-bottom: 1px solid var(--border);
    padding: 0 20px;
    background: var(--surface);
    flex-shrink: 0;
  }
  .tab {
    padding: 14px 18px; font-size: 0.78rem; font-weight: 700;
    color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent;
    transition: all .15s; letter-spacing: 0.03em;
    background: none; border-top: none; border-left: none; border-right: none;
    font-family: var(--sans);
  }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

  .panel { display: none; flex: 1; overflow: auto; padding: 20px; }
  .panel.active { display: flex; flex-direction: column; gap: 16px; }

  /* ── VIZ CANVAS ── */
  .viz-section { flex-shrink: 0; }
  .viz-title {
    font-size: 0.7rem; font-weight: 700; color: var(--accent2);
    letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 8px;
    display: flex; align-items: center; gap: 8px;
  }
  .viz-title::before { content: ''; display: block; width: 3px; height: 12px; background: var(--accent2); border-radius: 2px; }

  .viz-canvas {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    position: relative;
  }
  .viz-canvas svg { display: block; width: 100%; }

  /* ── DETAIL PANE ── */
  .detail-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
  }
  .detail-card h3 { font-size: 1rem; font-weight: 700; margin-bottom: 8px; }
  .detail-card p { font-size: 0.82rem; color: var(--muted); line-height: 1.6; }
  .detail-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .detail-tag {
    display: flex; align-items: center; gap: 5px;
    background: var(--border); border-radius: 5px; padding: 4px 9px;
    font-size: 0.72rem; font-family: var(--mono);
  }
  .detail-tag button {
    background: none; border: none; color: var(--muted); cursor: pointer;
    font-size: 0.75rem; line-height: 1; padding: 0 2px;
  }
  .detail-tag button:hover { color: var(--red); }
  .tag-add-inline { display: flex; gap: 8px; margin-top: 8px; }
  .tag-add-inline input {
    background: var(--surface); border: 1px solid var(--border); border-radius: 5px;
    padding: 5px 10px; color: var(--text); font-size: 0.78rem;
    font-family: var(--mono); outline: none; width: 140px;
  }
  .tag-add-inline input:focus { border-color: var(--accent); }

  /* ── SYNC BUFFER ── */
  .sync-feed {
    display: flex; flex-direction: column; gap: 6px;
  }
  .sync-item {
    display: flex; align-items: center; gap: 10px;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 7px; padding: 8px 12px;
    font-family: var(--mono); font-size: 0.72rem;
    animation: slideIn .3s ease;
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateX(-12px); }
    to   { opacity: 1; transform: translateX(0); }
  }
  .sync-action {
    padding: 2px 7px; border-radius: 3px; font-weight: 700;
    font-size: 0.65rem; letter-spacing: 0.06em; flex-shrink: 0;
  }
  .sync-action.CREATE { background: #10b98130; color: var(--green); }
  .sync-action.DELETE { background: #ef444430; color: var(--red); }
  .sync-action.UPDATE { background: #f59e0b30; color: var(--yellow); }
  .sync-note { flex: 1; color: var(--text); }
  .sync-time { color: var(--muted); font-size: 0.65rem; }
  .sync-slot {
    width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--border);
    font-size: 0.6rem; display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-weight: 700; flex-shrink: 0;
  }
  .sync-slot.filled { border-color: var(--accent2); color: var(--accent2); background: #06b6d415; }
  .sync-slot.current { border-color: var(--accent); color: var(--accent); background: #3b82f620; }

  /* ── STATS ── */
  .stats-row { display: flex; gap: 10px; flex-shrink: 0; }
  .stat-box {
    flex: 1; background: var(--card); border: 1px solid var(--border);
    border-radius: 8px; padding: 12px 14px;
  }
  .stat-box .sv { font-size: 1.6rem; font-weight: 800; font-family: var(--mono); }
  .stat-box .sl { font-size: 0.68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.07em; margin-top: 2px; }

  /* ── CODE PANEL ── */
  .code-block {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 8px; padding: 14px 16px;
    font-family: var(--mono); font-size: 0.75rem; line-height: 1.7;
    white-space: pre; overflow-x: auto; color: #a5f3fc;
  }
  .kw { color: #c084fc; }
  .fn { color: #67e8f9; }
  .cm { color: #475569; font-style: italic; }
  .st { color: #86efac; }
  .nu { color: #fdba74; }

  /* ── EMPTY STATE ── */
  .empty-state {
    flex: 1; display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 10px; color: var(--muted);
  }
  .empty-state svg { opacity: .25; }
  .empty-state p { font-size: 0.82rem; }

  /* scrollbar */
  ::-webkit-scrollbar { width: 5px; height: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
</style>
</head>
<body>

<header>
  <h1>Advanced Linked Lists</h1>
  <span class="badge">NOTE-TAKING APP</span>
  <span class="badge">CHAPTER 9</span>
</header>

<div class="layout">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <h2>Tambah Note</h2>
      <div class="add-form">
        <input id="inp-title" type="text" placeholder="Judul note…" />
        <textarea id="inp-content" placeholder="Isi catatan…"></textarea>
        <div class="tag-input-wrap">
          <input id="inp-tags" type="text" placeholder="tag1, tag2, …" />
        </div>
        <button class="btn btn-primary" onclick="addNote()">+ Tambah Note</button>
      </div>
    </div>

    <div class="view-toggle">
      <button class="vtab active" id="vt-chrono" onclick="setView('chrono')">⏱ Kronologis</button>
      <button class="vtab" id="vt-alpha"  onclick="setView('alpha')">🔤 Alfabetis</button>
    </div>

    <div class="note-list" id="note-list"></div>
  </aside>

  <!-- MAIN -->
  <main class="main">
    <div class="tabs">
      <button class="tab active" onclick="switchTab('viz')">Visualisasi</button>
      <button class="tab" onclick="switchTab('detail')">Detail Note</button>
      <button class="tab" onclick="switchTab('sync')">Sync Buffer</button>
      <button class="tab" onclick="switchTab('code')">Kode Python</button>
    </div>

    <!-- TAB: VISUALISASI -->
    <div class="panel active" id="tab-viz">
      <div class="stats-row" id="stats-row"></div>

      <div class="viz-section">
        <div class="viz-title">Doubly Linked List – Chain Kronologis</div>
        <div class="viz-canvas" id="canvas-chrono">
          <svg id="svg-chrono" height="90"></svg>
        </div>
      </div>

      <div class="viz-section">
        <div class="viz-title">Doubly Linked List – Chain Alfabetis</div>
        <div class="viz-canvas" id="canvas-alpha">
          <svg id="svg-alpha" height="90"></svg>
        </div>
      </div>

      <div class="viz-section">
        <div class="viz-title">Circular Buffer – Sync Status (capacity = 6)</div>
        <div class="viz-canvas" id="canvas-circ">
          <svg id="svg-circ" height="130"></svg>
        </div>
      </div>
    </div>

    <!-- TAB: DETAIL -->
    <div class="panel" id="tab-detail">
      <div id="detail-content" class="empty-state">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 12h6M9 16h6M6 2h12a2 2 0 012 2v16a2 2 0 01-2 2H6a2 2 0 01-2-2V4a2 2 0 012-2z"/></svg>
        <p>Pilih note di sidebar untuk melihat detail</p>
      </div>
    </div>

    <!-- TAB: SYNC BUFFER -->
    <div class="panel" id="tab-sync">
      <div class="viz-title">Circular Buffer – 6 Perubahan Terakhir</div>
      <div id="sync-circles" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;"></div>
      <div class="sync-feed" id="sync-feed"></div>
    </div>

    <!-- TAB: KODE -->
    <div class="panel" id="tab-code">
      <div class="viz-title">Implementasi Python</div>
      <div class="code-block" id="code-display"></div>
    </div>
  </main>
</div>

<script>
// ─────────────────────────────────────────────────────
// DATA STRUCTURES (JavaScript mirror of Python code)
// ─────────────────────────────────────────────────────

const COLORS = [
  '#3b82f6','#06b6d4','#8b5cf6','#10b981',
  '#f59e0b','#ef4444','#ec4899','#14b8a6'
];
let tagColorMap = {};
let tagColorIdx = 0;
function getTagColor(tag) {
  if (!tagColorMap[tag]) tagColorMap[tag] = COLORS[tagColorIdx++ % COLORS.length];
  return tagColorMap[tag];
}

// NoteNode
class NoteNode {
  constructor(title, content) {
    this.id         = Date.now() + Math.random();
    this.title      = title;
    this.content    = content;
    this.createdAt  = new Date();
    this.tags       = [];
    // chain pointers (simulated as references)
    this.nextByTime = null; this.prevByTime = null;
    this.nextByAlpha = null; this.prevByAlpha = null;
  }
  addTag(t) { if (!this.tags.includes(t)) this.tags.push(t); }
  removeTag(t) { this.tags = this.tags.filter(x=>x!==t); }
}

// NoteCollection – dual doubly linked list
class NoteCollection {
  constructor() {
    this.chronoHead = null; this.chronoTail = null;
    this.alphaHead  = null; this.alphaTail  = null;
    this.count = 0;
  }
  _insertChrono(node) {
    if (!this.chronoHead) { this.chronoHead = this.chronoTail = node; return; }
    if (node.createdAt <= this.chronoHead.createdAt) {
      node.nextByTime = this.chronoHead;
      this.chronoHead.prevByTime = node;
      this.chronoHead = node; return;
    }
    if (node.createdAt >= this.chronoTail.createdAt) {
      node.prevByTime = this.chronoTail;
      this.chronoTail.nextByTime = node;
      this.chronoTail = node; return;
    }
    let cur = this.chronoHead;
    while (cur && cur.createdAt < node.createdAt) cur = cur.nextByTime;
    node.nextByTime = cur; node.prevByTime = cur.prevByTime;
    cur.prevByTime.nextByTime = node; cur.prevByTime = node;
  }
  _insertAlpha(node) {
    if (!this.alphaHead) { this.alphaHead = this.alphaTail = node; return; }
    if (node.title.toLowerCase() <= this.alphaHead.title.toLowerCase()) {
      node.nextByAlpha = this.alphaHead;
      this.alphaHead.prevByAlpha = node;
      this.alphaHead = node; return;
    }
    if (node.title.toLowerCase() >= this.alphaTail.title.toLowerCase()) {
      node.prevByAlpha = this.alphaTail;
      this.alphaTail.nextByAlpha = node;
      this.alphaTail = node; return;
    }
    let cur = this.alphaHead;
    while (cur && cur.title.toLowerCase() < node.title.toLowerCase()) cur = cur.nextByAlpha;
    node.nextByAlpha = cur; node.prevByAlpha = cur.prevByAlpha;
    cur.prevByAlpha.nextByAlpha = node; cur.prevByAlpha = node;
  }
  _removeChrono(node) {
    if (node.prevByTime) node.prevByTime.nextByTime = node.nextByTime;
    else this.chronoHead = node.nextByTime;
    if (node.nextByTime) node.nextByTime.prevByTime = node.prevByTime;
    else this.chronoTail = node.prevByTime;
    node.nextByTime = node.prevByTime = null;
  }
  _removeAlpha(node) {
    if (node.prevByAlpha) node.prevByAlpha.nextByAlpha = node.nextByAlpha;
    else this.alphaHead = node.nextByAlpha;
    if (node.nextByAlpha) node.nextByAlpha.prevByAlpha = node.prevByAlpha;
    else this.alphaTail = node.prevByAlpha;
    node.nextByAlpha = node.prevByAlpha = null;
  }
  addNote(title, content, tags=[]) {
    const node = new NoteNode(title, content);
    tags.forEach(t => node.addTag(t.trim()));
    this._insertChrono(node);
    this._insertAlpha(node);
    this.count++;
    return node;
  }
  deleteNote(node) {
    this._removeChrono(node);
    this._removeAlpha(node);
    this.count--;
  }
  getChronoList() {
    const r=[]; let c=this.chronoHead;
    while(c){r.push(c);c=c.nextByTime;} return r;
  }
  getAlphaList() {
    const r=[]; let c=this.alphaHead;
    while(c){r.push(c);c=c.nextByAlpha;} return r;
  }
  findByTag(tag) { return this.getChronoList().filter(n=>n.tags.includes(tag)); }
}

// SyncCircularBuffer
class SyncCircularBuffer {
  constructor(cap=6) {
    this.cap = cap;
    this.slots = new Array(cap).fill(null);
    this.head = 0; // next write position
    this.size = 0;
  }
  add(noteTitle, action) {
    this.slots[this.head] = { noteTitle, action, time: new Date() };
    this.head = (this.head + 1) % this.cap;
    if (this.size < this.cap) this.size++;
  }
  getRecent() {
    const r = [];
    for (let i=1; i<=this.size; i++) {
      const idx = (this.head - i + this.cap) % this.cap;
      r.push({ ...this.slots[idx], slotIdx: idx });
    }
    return r;
  }
  getCurrentSlot() { return (this.head - 1 + this.cap) % this.cap; }
}

// ─────────────────────────────────────────────────────
// STATE
// ─────────────────────────────────────────────────────
const col = new NoteCollection();
const buf = new SyncCircularBuffer(6);
let currentView = 'chrono';
let selectedNode = null;
let activeTab = 'viz';

// seed data
const seeds = [
  ['Zebrafish Study',  'Penelitian ikan zebra terkait genetika.',  ['biologi','riset']],
  ['Python Tips',      'Tips seputar Python dan best practices.',  ['python','programming']],
  ['Algorithm Notes',  'Catatan algoritma dasar dan kompleksitas.',['cs','algorithm']],
  ['Mango Recipe',     'Resep es mangga segar untuk musim panas.', ['food','resep']],
  ['Biology Basics',   'Pengenalan biologi sel dan fungsinya.',    ['biologi','edukasi']],
  ['Data Structures',  'Linked list, tree, graph dan penerapannya.',['cs','programming']],
];
seeds.forEach(([t,c,tags]) => {
  const n = col.addNote(t,c,tags);
  buf.add(t,'CREATE');
});

// ─────────────────────────────────────────────────────
// RENDER
// ─────────────────────────────────────────────────────

function render() {
  renderStats();
  renderNoteList();
  renderChronoViz();
  renderAlphaViz();
  renderCircBuffer();
  renderSyncFeed();
  if (selectedNode) renderDetail(selectedNode);
}

function renderStats() {
  const notes = col.getChronoList();
  const allTags = [...new Set(notes.flatMap(n=>n.tags))];
  document.getElementById('stats-row').innerHTML = `
    <div class="stat-box">
      <div class="sv" style="color:var(--accent)">${col.count}</div>
      <div class="sl">Total Notes</div>
    </div>
    <div class="stat-box">
      <div class="sv" style="color:var(--accent2)">${allTags.length}</div>
      <div class="sl">Unique Tags</div>
    </div>
    <div class="stat-box">
      <div class="sv" style="color:var(--accent3)">${buf.size}</div>
      <div class="sl">Sync Records</div>
    </div>
    <div class="stat-box">
      <div class="sv" style="color:var(--green)">${buf.cap}</div>
      <div class="sl">Buffer Cap</div>
    </div>
  `;
}

function renderNoteList() {
  const list = currentView==='chrono' ? col.getChronoList() : col.getAlphaList();
  const el = document.getElementById('note-list');
  if (!list.length) { el.innerHTML='<div style="padding:20px;text-align:center;color:var(--muted);font-size:.78rem;">Belum ada note</div>'; return; }
  el.innerHTML = list.map((n,i)=>`
    <div class="note-item${selectedNode===n?' selected':''}" onclick="selectNote_${safeId(n.id)}()">
      <span class="note-idx">#${i+1}</span>
      <div class="ni-title">${esc(n.title)}</div>
      <div class="ni-meta">${fmt(n.createdAt)}</div>
      <div class="ni-tags">
        ${n.tags.map(t=>`<span class="tag-chip" style="background:${getTagColor(t)}22;color:${getTagColor(t)}">${esc(t)}</span>`).join('')}
      </div>
    </div>
  `).join('');
  // attach click handlers
  list.forEach(n=>{
    window[`selectNote_${safeId(n.id)}`] = ()=>{ selectedNode=n; render(); switchTab('detail'); };
  });
}

// ── DOUBLY LL VISUALIZER ──────────────────────────────
function renderDLL(svgId, nodes, labelFn) {
  const svg = document.getElementById(svgId);
  const W = svg.parentElement.clientWidth || 700;
  const H = 90;
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  svg.setAttribute('height', H);

  const nw=110, nh=52, gap=30, startX=18, cy=H/2;
  const total = nodes.length;
  const needed = total*(nw+gap)+startX;
  const vbW = Math.max(W, needed+20);
  svg.setAttribute('viewBox',`0 0 ${vbW} ${H}`);
  svg.style.width = total>5 ? `${vbW}px` : '100%';
  svg.parentElement.style.overflowX = total>5 ? 'auto' : 'hidden';

  let html='';
  nodes.forEach((n,i)=>{
    const x = startX + i*(nw+gap);
    const isSelected = n===selectedNode;
    const brd = isSelected ? 'var(--accent)' : 'var(--border)';
    const bg  = isSelected ? '#3b82f615' : 'var(--surface)';
    // node box
    html+=`<rect x="${x}" y="${cy-nh/2}" width="${nw}" height="${nh}" rx="6"
              fill="${bg}" stroke="${brd}" stroke-width="${isSelected?2:1}"/>`;
    // title text (truncated)
    const label = labelFn(n);
    html+=`<text x="${x+nw/2}" y="${cy-8}" text-anchor="middle"
              font-family="Syne,sans-serif" font-size="10" font-weight="700"
              fill="${isSelected?'#60a5fa':'#e2e8f0'}">${trunc(label,13)}</text>`;
    // index badge
    html+=`<text x="${x+nw/2}" y="${cy+8}" text-anchor="middle"
              font-family="JetBrains Mono,monospace" font-size="9"
              fill="var(--muted)">${fmt(n.createdAt).slice(0,8)}</text>`;
    // pointer indicators
    html+=`<text x="${x+12}" y="${cy+22}" font-family="JetBrains Mono,monospace"
              font-size="8" fill="#334155">prev</text>`;
    html+=`<text x="${x+nw-28}" y="${cy+22}" font-family="JetBrains Mono,monospace"
              font-size="8" fill="#334155">next</text>`;

    // arrow forward
    if (i<nodes.length-1) {
      const ax=x+nw, ay=cy-6, bx=x+nw+gap, by=cy-6;
      html+=arrow(ax,ay,bx,by,'#3b82f6');
      // arrow back
      html+=arrow(bx,cy+6,ax,cy+6,'#8b5cf6');
    }
    // HEAD / TAIL labels
    if (i===0) html+=`<text x="${x+nw/2}" y="${cy-nh/2-6}" text-anchor="middle"
      font-size="9" font-family="JetBrains Mono,monospace" fill="var(--green)">HEAD</text>`;
    if (i===nodes.length-1) html+=`<text x="${x+nw/2}" y="${cy-nh/2-6}" text-anchor="middle"
      font-size="9" font-family="JetBrains Mono,monospace" fill="var(--yellow)">TAIL</text>`;
  });

  if (!nodes.length) html=`<text x="20" y="50" font-size="12" fill="var(--muted)" font-family="Syne,sans-serif">— list kosong —</text>`;
  svg.innerHTML = html;
}

function arrow(x1,y1,x2,y2,col) {
  const dx=x2-x1, dy=y2-y1, len=Math.sqrt(dx*dx+dy*dy);
  const ux=dx/len, uy=dy/len, hs=5;
  const hx=x2-ux*hs, hy=y2-uy*hs;
  return `<line x1="${x1}" y1="${y1}" x2="${hx}" y2="${hy}" stroke="${col}" stroke-width="1.5"/>
          <polygon points="${x2},${y2} ${hx-uy*hs*.6},${hy+ux*hs*.6} ${hx+uy*hs*.6},${hy-ux*hs*.6}"
            fill="${col}"/>`;
}

function renderChronoViz() {
  renderDLL('svg-chrono', col.getChronoList(), n=>n.title);
}
function renderAlphaViz() {
  renderDLL('svg-alpha', col.getAlphaList(), n=>n.title);
}

// ── CIRCULAR BUFFER VISUALIZER ────────────────────────
function renderCircBuffer() {
  const svg = document.getElementById('svg-circ');
  const W = svg.parentElement.clientWidth || 500;
  const H = 130;
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);

  const cap = buf.cap;
  const cx = W/2, cy = H/2+5;
  const R = Math.min(cx-30, cy-18);
  const r = 22;
  const curSlot = buf.getCurrentSlot();
  const recent = buf.getRecent();
  const filledSlots = new Set(recent.map(x=>x.slotIdx));

  let html='';
  // outer ring
  html+=`<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="4 3"/>`;

  for (let i=0;i<cap;i++) {
    const angle = (i/cap)*Math.PI*2 - Math.PI/2;
    const sx = cx + R*Math.cos(angle);
    const sy = cy + R*Math.sin(angle);
    const isCur = i===curSlot && buf.size>0;
    const isFilled = filledSlots.has(i);
    const rec = recent.find(x=>x.slotIdx===i);

    const fill = isCur ? '#3b82f620' : isFilled ? '#06b6d415' : 'var(--card)';
    const stroke = isCur ? 'var(--accent)' : isFilled ? 'var(--accent2)' : 'var(--border)';
    const sw = isCur ? 2 : 1;

    html+=`<circle cx="${sx}" cy="${sy}" r="${r}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"/>`;
    html+=`<text x="${sx}" y="${sy-5}" text-anchor="middle" font-family="JetBrains Mono,monospace"
              font-size="9" font-weight="700" fill="${isCur?'var(--accent)':isFilled?'var(--accent2)':'var(--muted)'}">${i}</text>`;
    if (rec) {
      const ac = rec.action;
      const acColor = ac==='CREATE'?'var(--green)':ac==='DELETE'?'var(--red)':'var(--yellow)';
      html+=`<text x="${sx}" y="${sy+7}" text-anchor="middle" font-family="JetBrains Mono,monospace"
                font-size="8" fill="${acColor}">${ac.slice(0,3)}</text>`;
    } else {
      html+=`<text x="${sx}" y="${sy+7}" text-anchor="middle" font-family="JetBrains Mono,monospace"
                font-size="8" fill="var(--border)">—</text>`;
    }

    // arrow to next slot
    const nextAngle = ((i+1)/cap)*Math.PI*2 - Math.PI/2;
    const nx = cx + R*Math.cos(nextAngle), ny = cy + R*Math.sin(nextAngle);
    const midAngle = ((i+.5)/cap)*Math.PI*2 - Math.PI/2;
    const mx = cx + (R)*Math.cos(midAngle), my = cy + (R)*Math.sin(midAngle);
    // draw small directional arc indicator
    const ang1=(i/cap)*Math.PI*2-Math.PI/2+0.18, ang2=((i+1)/cap)*Math.PI*2-Math.PI/2-0.18;
    const x1=cx+R*Math.cos(ang1), y1=cy+R*Math.sin(ang1);
    const x2=cx+R*Math.cos(ang2), y2=cy+R*Math.sin(ang2);
    html+=`<path d="M${x1},${y1} A${R},${R} 0 0,1 ${x2},${y2}"
              fill="none" stroke="${isCur?'var(--accent)':'#1e2840'}" stroke-width="${isCur?2:1}"/>`;
  }

  // center label
  html+=`<text x="${cx}" y="${cy-4}" text-anchor="middle" font-family="Syne,sans-serif"
            font-size="11" font-weight="800" fill="var(--accent2)">CIRCULAR</text>`;
  html+=`<text x="${cx}" y="${cy+10}" text-anchor="middle" font-family="JetBrains Mono,monospace"
            font-size="9" fill="var(--muted)">size=${buf.size}/${buf.cap}</text>`;

  svg.innerHTML = html;
}

function renderSyncFeed() {
  // circles row
  const circDiv = document.getElementById('sync-circles');
  circDiv.innerHTML = '';
  for (let i=0;i<buf.cap;i++) {
    const cur = i === buf.getCurrentSlot() && buf.size>0;
    const recent = buf.getRecent();
    const filled = recent.some(x=>x.slotIdx===i);
    const d = document.createElement('div');
    d.className = `sync-slot ${cur?'current':filled?'filled':''}`;
    d.textContent = i;
    circDiv.appendChild(d);
  }

  // feed
  const feed = document.getElementById('sync-feed');
  const records = buf.getRecent();
  feed.innerHTML = records.length
    ? records.map(r=>`
        <div class="sync-item">
          <span class="sync-slot filled" style="font-size:.6rem">${r.slotIdx}</span>
          <span class="sync-action ${r.action}">${r.action}</span>
          <span class="sync-note">${esc(r.noteTitle)}</span>
          <span class="sync-time">${r.time.toLocaleTimeString('id-ID')}</span>
        </div>`).join('')
    : '<div style="color:var(--muted);font-size:.78rem;padding:8px">Buffer kosong</div>';
}

function renderDetail(node) {
  const el = document.getElementById('detail-content');
  el.className = '';
  el.innerHTML = `
    <div class="detail-card">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px">
        <div>
          <h3>${esc(node.title)}</h3>
          <div style="font-family:var(--mono);font-size:.68rem;color:var(--muted);margin-bottom:10px">${node.createdAt.toLocaleString('id-ID')}</div>
        </div>
        <button class="btn btn-danger btn-sm" onclick="deleteNote_${safeId(node.id)}()">Hapus</button>
      </div>
      <p>${esc(node.content)}</p>
      <div class="detail-tags" id="detail-tags-${safeId(node.id)}">
        ${node.tags.map(t=>`
          <div class="detail-tag">
            <span style="color:${getTagColor(t)}">${esc(t)}</span>
            <button onclick="removeTag_${safeId(node.id)}('${t}')">×</button>
          </div>`).join('')}
      </div>
      <div class="tag-add-inline">
        <input id="new-tag-${safeId(node.id)}" type="text" placeholder="tag baru…" onkeydown="if(event.key==='Enter')addTagInline_${safeId(node.id)}()"/>
        <button class="btn btn-ghost btn-sm" onclick="addTagInline_${safeId(node.id)}()">+ Tag</button>
      </div>
    </div>
    <div class="detail-card">
      <div style="font-size:.7rem;font-weight:700;color:var(--accent2);margin-bottom:10px;letter-spacing:.08em;text-transform:uppercase">Multi-Linked Pointers</div>
      <div style="font-family:var(--mono);font-size:.72rem;line-height:2;color:var(--muted)">
        <div>prevByTime → <span style="color:${node.prevByTime?'var(--accent)':'var(--red)'}">${node.prevByTime ? trunc(node.prevByTime.title,18) : 'NULL'}</span></div>
        <div>nextByTime → <span style="color:${node.nextByTime?'var(--accent)':'var(--red)'}">${node.nextByTime ? trunc(node.nextByTime.title,18) : 'NULL'}</span></div>
        <div>prevByAlpha → <span style="color:${node.prevByAlpha?'var(--accent3)':'var(--red)'}">${node.prevByAlpha ? trunc(node.prevByAlpha.title,18) : 'NULL'}</span></div>
        <div>nextByAlpha → <span style="color:${node.nextByAlpha?'var(--accent3)':'var(--red)'}">${node.nextByAlpha ? trunc(node.nextByAlpha.title,18) : 'NULL'}</span></div>
      </div>
    </div>
  `;
  // handlers
  window[`deleteNote_${safeId(node.id)}`] = () => {
    col.deleteNote(node);
    buf.add(node.title,'DELETE');
    selectedNode = null;
    document.getElementById('detail-content').className='empty-state';
    document.getElementById('detail-content').innerHTML=`
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 12h6M9 16h6M6 2h12a2 2 0 012 2v16a2 2 0 01-2 2H6a2 2 0 01-2-2V4a2 2 0 012-2z"/></svg>
      <p>Note berhasil dihapus</p>`;
    render();
  };
  window[`removeTag_${safeId(node.id)}`] = (t) => {
    node.removeTag(t);
    buf.add(node.title,'UPDATE');
    render();
  };
  window[`addTagInline_${safeId(node.id)}`] = () => {
    const inp = document.getElementById(`new-tag-${safeId(node.id)}`);
    const t = inp.value.trim();
    if (t) { node.addTag(t); buf.add(node.title,'UPDATE'); inp.value=''; render(); }
  };
}

// ─────────────────────────────────────────────────────
// ACTIONS
// ─────────────────────────────────────────────────────

function addNote() {
  const title   = document.getElementById('inp-title').value.trim();
  const content = document.getElementById('inp-content').value.trim();
  const tagsRaw = document.getElementById('inp-tags').value.trim();
  if (!title) { document.getElementById('inp-title').focus(); return; }
  const tags = tagsRaw ? tagsRaw.split(',').map(t=>t.trim()).filter(Boolean) : [];
  const node = col.addNote(title, content||'(kosong)', tags);
  buf.add(title,'CREATE');
  selectedNode = node;
  document.getElementById('inp-title').value = '';
  document.getElementById('inp-content').value = '';
  document.getElementById('inp-tags').value = '';
  render();
  switchTab('detail');
}

function setView(v) {
  currentView = v;
  document.getElementById('vt-chrono').className='vtab'+(v==='chrono'?' active':'');
  document.getElementById('vt-alpha').className='vtab'+(v==='alpha'?' active':'');
  renderNoteList();
}

function switchTab(t) {
  activeTab = t;
  document.querySelectorAll('.tab').forEach((el,i)=>{
    el.className = 'tab' + (['viz','detail','sync','code'][i]===t?' active':'');
  });
  document.querySelectorAll('.panel').forEach(el=>el.classList.remove('active'));
  document.getElementById(`tab-${t}`).classList.add('active');
  if (t==='code') renderCode();
}

// ─────────────────────────────────────────────────────
// CODE DISPLAY
// ─────────────────────────────────────────────────────

function renderCode() {
  const code = `<span class="cm"># ============================================
# Advanced Linked Lists – Note-Taking App
# Chapter 9 | Struktur Data Lanjut
# ============================================</span>

<span class="kw">class</span> <span class="fn">NoteNode</span>:
    <span class="kw">def</span> <span class="fn">__init__</span>(self, title, content):
        self.title      = title
        self.content    = content
        self.created_at = datetime.now()
        self.tags       = []          <span class="cm"># multi-linked tag list</span>

        <span class="cm"># ── Doubly Linked: Chain Kronologis ──</span>
        self.next_by_time  = <span class="kw">None</span>
        self.prev_by_time  = <span class="kw">None</span>

        <span class="cm"># ── Doubly Linked: Chain Alfabetis ───</span>
        self.next_by_alpha = <span class="kw">None</span>
        self.prev_by_alpha = <span class="kw">None</span>

<span class="kw">class</span> <span class="fn">NoteCollection</span>:
    <span class="cm">"""Dua doubly linked list berbagi node yang sama."""</span>
    <span class="kw">def</span> <span class="fn">add_note</span>(self, title, content, tags):
        node = NoteNode(title, content)
        <span class="kw">for</span> t <span class="kw">in</span> tags: node.tags.append(t)
        self._insert_chrono(node)   <span class="cm"># O(n) sorted by time</span>
        self._insert_alpha(node)    <span class="cm"># O(n) sorted by title</span>
        <span class="kw">return</span> node

    <span class="kw">def</span> <span class="fn">delete_note</span>(self, node):
        self._remove_chrono(node)   <span class="cm"># O(1) via prev pointer</span>
        self._remove_alpha(node)    <span class="cm"># O(1) via prev pointer</span>

    <span class="kw">def</span> <span class="fn">find_by_tag</span>(self, tag):
        result, cur = [], self.chrono_head
        <span class="kw">while</span> cur <span class="kw">is not None</span>:
            <span class="kw">if</span> tag <span class="kw">in</span> cur.tags:
                result.append(cur)
            cur = cur.next_by_time  <span class="cm"># O(n) traversal</span>
        <span class="kw">return</span> result

<span class="kw">class</span> <span class="fn">SyncCircularBuffer</span>:
    <span class="cm">"""Circular linked list – ring buffer perubahan."""</span>
    <span class="kw">def</span> <span class="fn">__init__</span>(self, capacity=<span class="nu">6</span>):
        self._cap   = capacity
        self._slots = [<span class="kw">None</span>] * capacity
        self._head  = <span class="nu">0</span>   <span class="cm"># posisi tulis berikutnya</span>
        self._size  = <span class="nu">0</span>

    <span class="kw">def</span> <span class="fn">add</span>(self, note_title, action):
        self._slots[self._head] = SyncRecord(note_title, action)
        self._head = (self._head + <span class="nu">1</span>) % self._cap  <span class="cm"># wrap-around</span>
        <span class="kw">if</span> self._size &lt; self._cap: self._size += <span class="nu">1</span>

    <span class="kw">def</span> <span class="fn">get_recent</span>(self, n=<span class="kw">None</span>):
        n = n <span class="kw">or</span> self._size
        result = []
        <span class="kw">for</span> i <span class="kw">in</span> range(<span class="nu">1</span>, n + <span class="nu">1</span>):
            idx = (self._head - i + self._cap) % self._cap
            result.append(self._slots[idx])
        <span class="kw">return</span> result`;
  document.getElementById('code-display').innerHTML = code;
}

// ─────────────────────────────────────────────────────

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function trunc(s,n) { return s.length>n ? s.slice(0,n-1)+'…' : s; }
function safeId(id) { return String(id).replace(/[^a-z0-9]/gi,'_'); }
function fmt(d) { return d.toLocaleTimeString('id-ID'); }

window.addEventListener('resize', ()=>{ renderChronoViz(); renderAlphaViz(); renderCircBuffer(); });
